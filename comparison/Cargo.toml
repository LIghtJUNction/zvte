[package]
name = "zvte-comparison"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
zvte = { path = ".." }
vte = { version = "=0.15.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "scan"
path = "src/scan_bench.rs"
