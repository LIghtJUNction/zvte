name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - src/**
      - comparison/**
      - .github/workflows/benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Capture compiler and hardware
        run: |
          mkdir -p benchmark-results
          rustc -Vv > benchmark-results/environment.txt
          uname -a >> benchmark-results/environment.txt
          lscpu >> benchmark-results/environment.txt
          git rev-parse HEAD >> benchmark-results/environment.txt
      - name: Verify all differential events
        run: cargo test --release --manifest-path comparison/Cargo.toml --locked
      - name: Same-callback benchmark
        run: cargo run --release --manifest-path comparison/Cargo.toml --locked --bin bench -- --mode strict --samples 7 --ms 100 > benchmark-results/strict.csv 2> benchmark-results/strict-metadata.txt
      - name: Batched text benchmark
        run: cargo run --release --manifest-path comparison/Cargo.toml --locked --bin bench -- --mode batch --samples 7 --ms 100 > benchmark-results/batch.csv 2> benchmark-results/batch-metadata.txt
      - name: Native-word scanner ablation
        run: cargo run --release --manifest-path comparison/Cargo.toml --locked --bin scan -- --samples 7 --ms 25 > benchmark-results/scanner.csv 2> benchmark-results/scanner-metadata.txt
      - name: Hardware counters when permitted
        shell: bash
        run: |
          if command -v perf >/dev/null && perf stat -e cycles,instructions,branches,branch-misses -- true 2>benchmark-results/perf-capability.txt; then
            for workload in ascii csi osc color-log short-chunks one-byte dcs unicode recording malformed truncated; do
              for engine in zvte vte; do
                perf stat -r 3 -x, -e cycles,instructions,branches,branch-misses -o "benchmark-results/perf-$workload-$engine.csv" -- comparison/target/release/bench --mode strict --engine "$engine" --filter "$workload" --perf-iterations 4096 > "benchmark-results/perf-work-$workload-$engine.csv"
              done
            done
          else
            echo 'Hardware counters unavailable on this runner; see perf-capability.txt.' >> benchmark-results/perf-capability.txt
          fi
      - name: Simulate branches with Cachegrind when hardware counters are unavailable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f benchmark-results/perf-ascii-zvte.csv ]; then
            exit 0
          fi
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y valgrind
          fi
          mkdir -p benchmark-results/branch-simulation
          valgrind --version > benchmark-results/branch-simulation/version.txt
          for workload in ascii csi osc color-log short-chunks one-byte dcs unicode recording malformed truncated; do
            for engine in zvte vte; do
              valgrind --tool=cachegrind --branch-sim=yes --cache-sim=no --error-exitcode=1 --cachegrind-out-file="benchmark-results/branch-simulation/$workload-$engine.out" --log-file="benchmark-results/branch-simulation/$workload-$engine.log" comparison/target/release/bench --mode strict --engine "$engine" --filter "$workload" --perf-iterations 256 > "benchmark-results/branch-simulation/$workload-$engine-work.csv"
            done
          done
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root = Path('benchmark-results/branch-simulation')
          with (root / 'simulated-branches.csv').open('w', newline='') as target:
              writer = csv.writer(target)
              writer.writerow(['workload', 'engine', 'iterations', 'total_bytes', 'conditional_branches', 'conditional_misses', 'indirect_branches', 'indirect_misses', 'total_branches', 'total_misses', 'simulated_miss_percent'])
              for path in sorted(root.glob('*.out')):
                  lines = path.read_text().splitlines()
                  events = next(line.split()[1:] for line in lines if line.startswith('events:'))
                  counts = next(line.split()[1:] for line in lines if line.startswith('summary:'))
                  values = dict(zip(events, map(int, counts)))
                  work = next(csv.DictReader(path.with_name(path.stem + '-work.csv').open()))
                  branches = values['Bc'] + values['Bi']
                  misses = values['Bcm'] + values['Bim']
                  writer.writerow([work['workload'], work['engine'], work['iterations'], work['total_bytes'], values['Bc'], values['Bcm'], values['Bi'], values['Bim'], branches, misses, 100 * misses / branches if branches else 0])
          (root / 'README.txt').write_text('Cachegrind branch-predictor SIMULATION, not physical hardware PMU measurements. Counts cover the isolated single-engine process, including workload setup and reporting. Both engines use identical inputs and 256 iterations. Worker elapsed_ns is instrumented execution time and must not be used as parser throughput.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-results/
          if-no-files-found: error
