name: Release
run-name: Release (${{ inputs.bump || 'none' }}) by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; none publishes the current version or resumes it
        required: true
        default: patch
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: zvte-release
  cancel-in-progress: false

jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_SOURCE: ${{ github.sha }}
      RELEASE_BUMP: ${{ inputs.bump || 'none' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check credentials and current default branch
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure the CARGO_REGISTRY_TOKEN repository secret before releasing.'
            exit 1
          fi
          git fetch origin "$RELEASE_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_SOURCE" ]; then
            echo '::error::The default branch has moved. Dispatch a new release from its current head.'
            exit 1
          fi
      - name: Prepare selected version
        id: version
        run: python scripts/release.py prepare --bump "$RELEASE_BUMP"
      - name: Commit version bump locally
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock comparison/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "release: zvte $VERSION"
          fi
      - name: Reject a conflicting tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo '::error::The version tag already points at a different commit.'
              exit 1
            fi
          fi
      - name: Verify the exact release version and package
        env:
          RUSTFLAGS: -Dwarnings
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
          cargo test --manifest-path comparison/Cargo.toml --locked
          cargo doc --no-deps --all-features --locked
          python scripts/check-package.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
          cargo publish --dry-run --locked
          git diff --exit-code
      - name: Push verified version commit
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Publish verified archive to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python scripts/release.py publish
      - name: Tag the published commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "target/package/zvte-$VERSION.crate" --clobber
          else
            gh release create "$RELEASE_TAG" "target/package/zvte-$VERSION.crate" --verify-tag --title "zvte $VERSION" --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft
          echo "Published zvte $VERSION to crates.io and GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
